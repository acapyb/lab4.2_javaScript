<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Cafe Faculty of Computing</h1>
    </header>

    <main>
        <section id="menu">
            <h2>Menu</h2>
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Price (RM)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Nasi Kerabu</td>
                        <td>12</td>
                        <td><button onclick="addItem('Nasi Kerabu', 12)">Add to Cart</button></td>
                    </tr>
                    <tr>
                        <td>Nasi Tomato</td>
                        <td>12</td>
                        <td><button onclick="addItem('Nasi Tomato', 12)">Add to Cart</button></td>
                    </tr>
                    <tr>
                        <td>Nasi Lemak</td>
                        <td>8</td>
                        <td><button onclick="addItem('Nasi Lemak', 8)">Add to Cart</button></td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section id="cart">
            <h2>Cart</h2>
            <ul id="cart-items">
                <!-- Cart items will be dynamically added here -->
            </ul>
            <div id="cart-total">
                Total: RM <span id="total">0</span>
            </div>
            <button id="checkout-btn" onclick="checkout()">Checkout</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
